name: censo-escolar

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-censo}
      POSTGRES_USER: ${POSTGRES_USER:-censo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?defina API_DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-censo_admin} -d ${POSTGRES_DB:-censo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # O banco NAO e exposto na rede do servidor. Para acessar de fora (DBeaver etc.)
    # use um tunel SSH ou descomente a linha abaixo (somente localhost):
    # ports: ["127.0.0.1:5432:5432"]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-censo}
      DB_USER: censo_api
      DB_PASSWORD: ${API_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  # ETL: executado sob demanda (nao sobe com "docker compose up").
  #   docker compose run --rm etl
  etl:
    build: ./etl
    profiles: ["etl"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-censo}
      DB_USER: ${POSTGRES_USER:-censo_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CENSO_ANOS: ${CENSO_ANOS:-2024 2025}
      CENSO_URL_TEMPLATE: ${CENSO_URL_TEMPLATE:-https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_{ano}.zip}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
