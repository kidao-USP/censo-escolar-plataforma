# nginx sem privilegios (porta 8080), atras do Caddy (que faz o HTTPS).

# IP real do cliente: confiar no X-Forwarded-For apenas vindo das redes internas do Docker.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Limites de taxa por IP: consultas normais e exportacoes CSV (mais pesadas).
map $arg_formato $chave_csv {
    default "";
    csv     $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $chave_csv          zone=csv:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=conexoes:10m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1k;
    limit_conn conexoes 20;

    # Apenas consultas (GET/HEAD) chegam a API.
    location /api/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=api burst=20 nodelay;
        limit_req zone=csv burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # Documentacao interativa da API (Swagger carrega scripts de CDN: sem CSP restritiva aqui).
    location = /docs { limit_req zone=api burst=10 nodelay; proxy_pass http://api:8000/docs; }
    location = /openapi.json { limit_req zone=api burst=10 nodelay; proxy_pass http://api:8000/openapi.json; }

    # Frontend estatico, com CSP restritiva (so recursos do proprio site).
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }
}
